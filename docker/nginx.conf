server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # DO NOT add a `types { ... }` block here. A types block in server context
    # REPLACES the whole map inherited from http (which includes mime.types),
    # so declaring just `application/wasm wasm` silently downgrades every other
    # file — including the JS bundles — to application/octet-stream, and a
    # module script with that type is refused outright. nginx:1.27-alpine's
    # stock mime.types already maps both `wasm` and `js` correctly; verified
    # in-image with `grep wasm /etc/nginx/mime.types`.

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm;
    gzip_min_length 1024;

    # Fingerprinted assets are immutable; the corpus JSON is not (a rebuild
    # replaces it in place), so it revalidates.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /data/ {
        add_header Cache-Control "no-cache";
    }

    # The app uses HashRouter, so deep links never hit the server as paths —
    # this fallback only matters for a stray refresh at an unknown URL.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The tree-sitter grammars must be served as application/wasm or
    # WebAssembly.instantiateStreaming refuses them and in-browser extraction
    # dies at "loading parsers". nginx's stock mime.types is inconsistent
    # about this across versions, so declare it explicitly.
    types {
        application/wasm wasm;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm;
    gzip_min_length 1024;

    # Fingerprinted assets are immutable; the corpus JSON is not (a rebuild
    # replaces it in place), so it revalidates.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /data/ {
        add_header Cache-Control "no-cache";
    }

    # The app uses HashRouter, so deep links never hit the server as paths —
    # this fallback only matters for a stray refresh at an unknown URL.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

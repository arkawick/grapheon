<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no: page-level pinch would fight the map's own pinch
         zoom (pixi-viewport). Standard trade for canvas-map apps. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Grapheon</title>
    <!-- SVG favicon: one file at every size, and the mark stays crisp at the
         16px the browser actually draws. icon.svg carries its own dark tile so
         the light-blue gradient still reads on a white tab strip. -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#0d0d14" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
